# reverse proxy for gunicorn. the two stream routes must not be buffered

upstream wvs_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/wvs_access.log;
    error_log  /var/log/nginx/wvs_error.log;

    # nginx serves the css and js itself, gunicorn does not need to
    location /static/ {
        alias /home/pi/webviz/static/;
        expires 1h;
    }

    # normal requests, the page and the json api
    location / {
        proxy_pass http://wvs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # server sent events, has to go straight through unbuffered
    location /stream {
        proxy_pass http://wvs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # the connection stays open for the whole flight
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # mjpeg video, same deal, frames must not sit in a buffer
    location /video_feed {
        proxy_pass http://wvs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
